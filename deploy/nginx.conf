# Кодекс — пример server-блока Nginx для статического SPA-билда.
# Содержимое каталога build/ кладётся в root (ниже /var/www/codex).
# Деплой: rsync -avz --delete build/ user@host:/var/www/codex/
#
# Ключевое: SPA-fallback (try_files ... /index.html) — чтобы прямые ссылки
# вида /statistics/day/5 открывались (клиентский роутер разберёт путь сам).

server {
    listen 80;
    listen [::]:80;
    server_name codex.example.com;          # ← свой домен

    root /var/www/codex;                     # ← сюда залит build/
    index index.html;

    # Захешированные ассеты Vite — кэшируем навсегда (имя меняется при сборке)
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-fallback: любой неизвестный путь → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}

# HTTPS: проще всего выпустить сертификат через certbot --nginx,
# он сам перепишет этот блок на listen 443 ssl.
